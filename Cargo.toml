[workspace]
resolver = "3"
members = [
  "crates/rule-core",
  "crates/protocol",
  "contracts/game",
  "contracts/token",
  "enclave/referee",
  "verifier/cli",
  "tests/sandbox",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"

# Contract and referee builds. Overflow checks stay on: money arithmetic must panic, never wrap.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false

# Test builds: optimized enough for property tests, without the slow link-time optimization.
[profile.fast]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
