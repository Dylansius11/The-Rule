[package]
name = "referee"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "process"
path = "src/process_tests.rs"
[features]
default = []
demo = []

[dependencies]
protocol = { path = "../../crates/protocol" }
rule-core = { path = "../../crates/rule-core" }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[target.'cfg(target_os = "wasi")'.dependencies]
outlayer = { version = "=0.2.1", features = ["encryption-keys"] }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
