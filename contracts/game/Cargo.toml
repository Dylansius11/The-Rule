[package]
name = "game"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }
borsh = "=1.8.1"
protocol = { path = "../../crates/protocol" }
rule-core = { path = "../../crates/rule-core" }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
proptest = "=1.12.0"
wasmparser = "=0.240.0"

[lints]
workspace = true
