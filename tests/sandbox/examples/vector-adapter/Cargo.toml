[workspace]

[package]
name = "vector-adapter"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = ["contract"]
contract = ["dep:near-sdk", "dep:borsh"]
web = ["dep:wasm-bindgen"]


[dependencies]
verifier-cli = { path = "../../../../verifier/cli" }
protocol = { path = "../../../../crates/protocol" }
rule-core = { path = "../../../../crates/rule-core" }
serde_json = "=1.0.154"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
near-sdk = { version = "=5.30.0", optional = true }
borsh = { version = "=1.8.1", optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }
