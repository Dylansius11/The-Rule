[package]
name = "probe-referee"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
outlayer = { version = "=0.2.1", default-features = false, features = ["encryption-keys"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
